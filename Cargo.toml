[package]
name = "climb"
version = "0.1.0"
edition = "2021"
description = "Hill-climb driving physics in Rust/WebAssembly: articulated chassis, sprung wheel bodies, baked terrain"
license = "MIT"
repository = "https://github.com/pescadordegoiaba/hcr2-rust"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
lto = true
opt-level = "z"
panic = "abort"
codegen-units = 1
